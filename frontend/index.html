<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="Bipon Net: DNS filtrante, control parental, VPN y herramientas de red para tu casa o empresa.">
  <title>Bipon Net</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script>
    // aplica tema e idioma antes de pintar (evita parpadeos)
    try {
      const p = JSON.parse(localStorage.getItem("bipon-ui") || "{}");
      const r = document.documentElement;
      const light = ["glass-light", "zinc-light", "sunset"];
      r.dataset.skin = p.skin || "glass";
      r.dataset.theme = light.includes(p.skin) ? "light" : "dark";
      if (p.bg) r.dataset.bg = p.bg;
      if (p.blur) r.dataset.blur = p.blur;
      r.lang = localStorage.getItem("bipon-lang") || "es";
    } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
